name: VSIX candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# The job owns its runner, so the suite runner's free memory wait is off.
env:
  ARC_TEST_MEMORY_FLOOR_GB: '0'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
            cli/package-lock.json
      - name: Check the tag against the extension version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./extension/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match extension/package.json version ${version}."
            exit 1
          fi
          node scripts/release-version.js --notes "$version" > /dev/null
      - name: Install zsh and ImageMagick
        id: system-setup
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh imagemagick
          # Ubuntu ships ImageMagick 6, which has no magick command. The panel shots call
          # `magick <in> <out>` and `magick compare`, which map to convert and compare.
          printf '#!/bin/sh\nif [ "$1" = compare ]; then shift; exec compare "$@"; fi\nexec convert "$@"\n' \
            | sudo tee /usr/local/bin/magick > /dev/null
          sudo chmod +x /usr/local/bin/magick
          magick -list format | grep -i webp
      - run: npm ci
        id: root-setup
        if: ${{ !cancelled() }}
      - run: npm --prefix extension ci
        id: extension-setup
        if: ${{ !cancelled() }}
      - run: npm --prefix cli ci
        id: cli-setup
        if: ${{ !cancelled() }}
      - name: Install bundled Chromium and system dependencies
        id: browser-setup
        if: ${{ !cancelled() && steps.extension-setup.outcome == 'success' }}
        run: node extension/node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
      - run: npm run test:all
        if: ${{ !cancelled() }}
        env:
          ARC_TEST_REPORT_DIR: ${{ runner.temp }}/arc-all
          ARC_TEST_ROOT_SETUP_FAILED: ${{ steps.root-setup.outcome != 'success' && '1' || '' }}
          ARC_TEST_EXTENSION_SETUP_FAILED: ${{ steps.extension-setup.outcome != 'success' && '1' || '' }}
          ARC_TEST_CLI_SETUP_FAILED: ${{ steps.cli-setup.outcome != 'success' && '1' || '' }}
          ARC_TEST_BROWSER_SETUP_FAILED: ${{ steps.browser-setup.outcome != 'success' && '1' || '' }}
          ARC_TEST_SYSTEM_SETUP_FAILED: ${{ steps.system-setup.outcome != 'success' && '1' || '' }}
      - name: Publish test summary
        if: always()
        run: node scripts/test-summary.mjs ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-test-results
          path: ${{ runner.temp }}/arc-all
          if-no-files-found: ignore
      - run: npm --prefix extension run build
      - run: npm --prefix extension run package
      - run: node extension/scripts/check-vsix.mjs
      - name: Prepare hosted plugin candidate
        run: node scripts/package-claude-plugin.js release
      - name: Prepare candidate files
        shell: bash
        run: |
          version="$(node -p "require('./extension/package.json').version")"
          mkdir -p release
          cp extension/arc.vsix "release/glin.arc-${version}.vsix"
          cd release
          sha256sum "glin.arc-${version}.vsix" > "glin.arc-${version}.vsix.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: arc-vsix-candidate-${{ github.sha }}
          path: release/
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: arc-vsix-candidate-${{ github.sha }}
          path: release/
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-version.js --notes "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
