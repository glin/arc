name: Inspect Arc demo site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install
          npm --prefix extension install
      - name: Build static demo
        run: npx tsx extension/scripts/web-demo.ts .scratch-web-demo/site
      - name: Inspect static demo
        run: node .github/scripts/check-web-demo-site.mjs .scratch-web-demo/site
